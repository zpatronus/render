name: Deploy to Render

on:
  push:
    branches: [main]
    paths: [DEPLOY_VERSION]

permissions:
  contents: read

concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release
        run: |
          test -s DEPLOY_VERSION
          go test -race ./...
          node --test internal/*/web/*.test.mjs
          go build -trimpath -o bin/server .
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo '::error::Add the RENDER_DEPLOY_HOOK_URL repository secret.'
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 60 \
            --request POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
          echo 'Deploy requested. Check Render for deployment status.'
