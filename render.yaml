services:
  - type: web
    name: sidequests
    runtime: go
    autoDeployTrigger: 'off'
    plan: free
    buildCommand: go build -trimpath -o bin/server .
    startCommand: ./bin/server
    healthCheckPath: /healthz
    envVars:
      - key: SIDEQUESTS_STORAGE
        value: memory
      - key: GOTOOLCHAIN
        value: auto
