<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1b1e19"><meta name="color-scheme" content="dark"><title>谁是卧底 · Sidequests</title><link rel="stylesheet" href="/undercover/style.css"><link rel="icon" type="image/png" href="/favicon.png"></head>
<body><header><nav aria-label="首页导航"><a href="/">Sidequests home</a><a href="/undercover/">谁是卧底首页</a></nav></header>
<main><section id="lobby"><h1>谁是<br><span>卧底。</span></h1><div class="entry-grid"><form id="create"><h2>创建房间</h2><label for="host-name">昵称</label><input id="host-name" autocomplete="nickname" maxlength="20" required><button class="primary" type="submit">建房 <span>↗︎</span></button></form><form id="join"><h2>加入房间</h2><label for="guest-name">昵称</label><input id="guest-name" autocomplete="nickname" maxlength="20" required><label for="code">房间码</label><input id="code" class="code-input" maxlength="6" minlength="6" pattern="[a-fA-F0-9]{6}" autocomplete="off" required><button type="submit">加入 <span>↗︎</span></button></form></div></section>
<section id="room" hidden><div class="room-heading"><div><h1 id="room-code"></h1><p id="round"></p></div><div class="actions"><button id="share" type="button">复制邀请</button><button id="leave" type="button">离开房间</button></div></div><div class="room-grid"><section class="members"><h2>玩家 <span id="player-count"></span></h2><button id="start-vote" class="primary" type="button" hidden>开始投票</button><p id="vote-status" role="status" hidden></p><ol id="players"></ol></section><section class="control-panel"><form id="deal" hidden><div class="counts"><div><label for="room-spies">卧底</label><input id="room-spies" type="number" min="1" max="9" required></div><div><label for="room-blanks">白板</label><input id="room-blanks" type="number" min="0" max="9" required></div></div><output id="civilian-count"></output><button class="primary" type="submit">发词 <span>↗︎</span></button></form><div id="waiting" class="waiting" hidden>等待房主发词</div><section id="card" hidden aria-label="你的词牌"><button id="reveal" class="word-card" type="button" aria-pressed="false" aria-label="显示或隐藏我的词"><span id="covered">点击查看我的词</span><span id="secret" class="secret" hidden><span id="word"></span><span class="card-action">点击收起</span></span></button></section><button id="reset" type="button" hidden>下一局 ↗︎</button></section></div></section><p id="message" role="status" aria-live="polite" hidden></p></main>
<footer><span id="bank-count"></span><details><summary>玩法</summary><p>每人用自己的手机加入同一房间。房主设置卧底与白板人数，其余人都是普通人。发词后，各自查看自己的词；普通词牌不标注普通人或卧底，白板没有词。</p><p>讨论后由房主开始投票。未出局的玩家各投一票，确认后不能更改。最高票玩家出局，只公开身份；最高票并列时无人出局，房主可重新发起投票。出局的房主仍可主持投票。结束后由房主点「下一局」。</p></details></footer><dialog id="confirm-dialog" class="app-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-note"><h2 id="confirm-title"></h2><p id="confirm-note" hidden></p><div class="dialog-actions"><button id="confirm-cancel" type="button" autofocus>取消</button><button id="confirm-accept" class="primary" type="button">确认</button></div></dialog><script src="/identity.js"></script><script src="/undercover/app.js" defer></script></body></html>
